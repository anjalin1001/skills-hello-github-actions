name: Deploy Airflow DAGs

on:
  push:
    branches:
      - 'main'

  pull_request:
    branches:
      - 'main'
      - 'feature/homedepot'

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install flake8 pytest

      - name: Lint DAGs
        continue-on-error: true
        run: |
          flake8 .

#      - name: Run Tests
#        run: |
#          pytest tests/

  deploy:
    needs: validate

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          #workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          workload_identity_provider: "projects/970332938397/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Mirror repo to GCS (exact structure, delete stale)
        run: |
          gsutil -m rsync -r -d \
            -x "^\.git/.*$|^\.github/.*$|^README\.md$|^\.gitignore$" \
            . "${{ secrets.COMPOSER_BUCKET }}"
      - name: Mirror only relevant folders to GCS
        run: |
          for dir in ${{ vars.SYNC_DIRS }}; do
            if [ -d "$dir" ]; then
              echo "Syncing $dir"
              gsutil -m rsync -r -d "$dir" "${{ secrets.COMPOSER_BUCKET }}/$dir"
            fi
          done
